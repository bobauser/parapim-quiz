<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Development Ecosystems - Quiz</title>
  <link rel="stylesheet" href="ezstyle.css">
  <script src="script.js"></script>
</head>
<body>

  <h1>Maskinlæring og Kunstig Intelligens
    <a href="index.html">Gå tilbake til vanlig quiz</a>
  </h1>

    <div class="card" id="quiz-card">

      <header>
        <span id="points">Poeng: 0</span>

        <div id="isMc">Multiple Choice!</div>
      </header>

        <div id="question">

        </div>

        <ul id="options">

        </ul>

        <button id="submit" class="default blue">Sjekk Svar</button>
        <button id="next" class="default gray">Neste Spørsmål</button>

        <div class="response-bar">
            <div id="feedback"></div>
            <div id="correct-answer"></div>
        </div>

    </div>

    <div id="restart-card" class="card restart-quiz hidden">
      <h1>Quiz ferdig!</h1>
      <span id="finished-quiz-points">Poeng: </span>
      <h3>Ta quizen på nytt!</h3>
      <button class="black-button" id="restart-quiz-button">Retry</button>
    </div>

  <footer>
    <span>Quiz 2025</span>
    <span>Maskinlæring og Kunstig Intelligens</span>
    <button class="black-button" onclick="scrollToSection('question')">
        Go to the top
    </button>
  </footer>

  <h3 style="color: white;">Versjon 1.11  Oppdatert 4. Desember</h3>

</body>

<script>
  setJsonUrl("maskinlæringAIeksamen.json")
</script>

<style>
  body {
    background-color: #acacac;
  }

  .card {
    background-color: #d6d2c4;
  }

  header {
    color: white;
    font-weight: 500;
    font-size: 1rem;
    background-color: #00000070;
    padding: 10px;
    border-radius: 15px;
    border: 2px solid #ffffff;

    display: flex;
    gap: 20px;
    align-items: center;
  }

  #isMc {
    padding: 8px;
    background-color: #32b3ce;
    border-radius: 15px;
  }
  
.hidden {
    display: none !important;
}
</style>

</html>
