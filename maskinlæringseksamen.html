<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Development Ecosystems - Quiz</title>
  <link rel="stylesheet" href="ezstyle.css">
  <script src="script.js"></script>
</head>
<body>

  <h1>Maskinlæring og Kunstig Intelligens
    <a href="index.html">Gå tilbake til vanlig quiz</a>
  </h1>

    <div class="card" id="quiz-card">

      <header>
        <span id="points">Poeng: 0</span>

        <div id="isMc">Multiple Choice!</div>
      </header>

        <div id="question">

        </div>

        <section id="figure-section" class="hidden">
          <figure class="expandable" id="fig1">
            <img src="" />
          </figure>
          <button id="figure-expand-btn" data-target="fig1">Expand</button>
        </section>

        <ul id="options">

        </ul>

        <button id="submit" class="default blue">Sjekk Svar</button>
        <button id="next" class="default gray">Neste Spørsmål</button>

        <div class="response-bar">
            <div id="feedback"></div>
            <div id="correct-answer"></div>
        </div>

    </div>

    <div id="restart-card" class="card restart-quiz hidden">
      <h1>Quiz ferdig!</h1>
      <span id="finished-quiz-points">Poeng: </span>
      <h3>Ta quizen på nytt!</h3>
      <button class="black-button" id="restart-quiz-button">Retry</button>
    </div>

  <footer>
    <span>Quiz 2025</span>
    <span>Maskinlæring og Kunstig Intelligens</span>
    <button class="black-button" onclick="scrollToSection('question')">
        Go to the top
    </button>
  </footer>

  <h3 style="color: white;">Versjon 1.12  Oppdatert 5. Desember 2025</h3>

</body>

<script>
  setJsonUrl("maskinlæringAIeksamen.json")
</script>

<style>
  body {
    background-color: #acacac;
  }

  .card {
    background-color: #d6d2c4;
  }

  header {
    color: white;
    font-weight: 500;
    font-size: 1rem;
    background-color: #00000070;
    padding: 10px;
    border-radius: 15px;
    border: 2px solid #ffffff;

    display: flex;
    gap: 20px;
    align-items: center;
  }

  #isMc {
    padding: 8px;
    background-color: #32b3ce;
    border-radius: 15px;
  }
  
  .hidden {
      display: none !important;
  }

.expandable {
  width: 200px;          /* collapsed size */
  height: 200px;         /* collapsed size */
  overflow: hidden;
  transition: width 0.3s ease, height 0.3s ease;
  border-radius: 6px;
  cursor: pointer;
  outline: 5px solid #7e7e7e;
    background-color: #a4a4a4;
    padding: 8px;
}

.expandable.expanded {
  width: 500px;          /* expanded size */
  height: 500px;         /* expanded size */
}

.expandable img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#figure-expand-btn {
  margin-top: 8px;
  padding: 6px 14px;
  cursor: pointer;
}

</style>
